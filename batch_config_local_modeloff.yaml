# Where fresh workspaces are created (agent works here)
workspace_base_dir: "./workspaces"

# Where final results are saved + attempts.jsonl log
results_dir: "./results"

# Task type: "fmwc" (default) or "wsp" — selects the task template
task_type: "fmwc"

# Execution settings
max_iterations: 25
prompt_version: "v11"
max_completion_tokens: 90000
api_timeout_seconds: 600
fresh_context_mode: true
enhanced_excel_context: false
cleanup_workspace: false              # Keep workspace for inspection
verbose: true
yaml_trace_logging: true              # Log model inputs/outputs to YAML files in workspace
summarize_excel_context: false        # Summarize starting Excel files before sending to model

# Formatting Audit Settings (optional)
formatting_audit: true        # Run periodic formatting audit
formatting_audit_interval: 5          # Run audit every __ iteration & on completion (default: 5)